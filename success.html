<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .card{
        border: 1px solid black;
        border-radius: 15px;
        display: flex;
        flex-direction: column;
        margin: auto;
        width: 300px;
        min-height: 300px;
        align-items: center;

    }
    img{
        width:100px;
        height:100px;
        border-radius: 50%;
        margin-top: 10px;
    }
    p{
        text-align: center;
    }
    button{
        width:100px;
        height:40px;
        padding: 6px;
        border-radius:8px;
        background-color: blue;
        color: white;
    }
button:hover{
    background-color: royalblue;
    color: white;
    transform: scale(1.11);
}
    </style>
</head>
<body>
    <div class="card">
<img src="profile.png.png" alt="profile picture">
<h2>BIG LAYO</h2>
<p>web developer that love html and css</p>
<button class="submit"></button>
    </div>
</body>
</html>
