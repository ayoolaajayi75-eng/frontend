<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            border: 1px solid rgb(11, 4, 4);
            width: 80%;
            margin: auto;
            padding: 5px;
        }
        header{
            background-color: lightblue;
            text-align: center;
            margin-top: 0;
            padding: 10px;
        }
        main{
            border: 1px solid black;
            width: 99%;
            margin: auto;
            padding: 3px;
            height: 300px;
        }
        button{
            border: 1px solid lightgreen;
        }
        button:hover{
            background-color: green;
            color: white;
        }
        .box{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: lightblue;
            width: 98%;
            margin-bottom: 0px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Welcome to my page</h1>
            <p>This is a simple example with divs and css</p>
        </header><br>
        <main>
            <h3>about</h3>
            <p>This section is inside the content div,You can add text,images,anything here.</p>
            <button>Click Me</button>
        </main>
        <br>
        <header class="box">
            <p> &copy; 2026 My Simple Website</p>
        </header>

    </div>
</body>
</html>
