<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <style>
  body{
    margin: 0;
    font-family: georgia, serif;
    background-color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

    contact-box{
       background: white;
        width:80%;
        min-width: 520px;
        padding: 20px;
        border-radius: 20px;
        text-align: center;
    }  

        h1{
            margin: 0015px;
            font-weight: bold;
        }

         p{
            font-size: 22px;
         }

        .email{
        
            color: blue;
            fort-size: 22px;
            fort-weight:bold;
        }

        input, textarea{
            box-sizing: border-box;
            width: 100%;
            padding: 12px 3px;
            margin: 7px 0;
            border: 1px solid blueviolet;
            border-radius: 8px;
            fort-family: inherit;
        }
        textarea{
            height: 80px;
            resize: vertical;
        }
    </style>
</head>

<body>
    <div class="contact-box">
<h1>Contact Us</h1>
<p>Were here to help! Reach out anytime.</p>
<p>
    <span class="email">Email:</span>
    support@loanapp.com
</p>
<form>
    <input type="text"placeholder="Your name"><br>
    <input type="Email"placeholder="Your email"><br>
    <textarea name="content" placeholder=" Your message" rows="6" cols="30"></textarea><br><br>

  </form>
 </div>
</body>
