<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: darkcyan;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 200px;

        }
        div{
            border-radius: 10px;
            height: 450px;
            width: 400px;
            background-color: white;
            padding: 10px;
        }
        h1{
            margin-bottom: 2px;
        }
        
        button{
            width: 300px;
            height: 35px;
            text-align: justify;
            border-style: hidden;
            background-color: green;
            color: white;
            padding: 10px;
            border-radius: 5px;
        }
        input{
            width: 300px;
            height: 30px;
            border-radius: 5px;
            border: 1px solid lightblue;
        }
        input:hover{
            border: 2px solid lightblue;
        }
        .texts {
            text-align: center;
        }
        h1 {
            margin-bottom: 5px;
        }
        h3 {
            margin-bottom: 5px;
        }


    </style>
</head>
<body>
    <div>
        <h1>Create Account</h1>
        <p>Join AccountHub today!</p>
        <form action="subjet.js">
            <h3>Full Name</h3>
            <input type="Full name" placeholder="BIG LAYO">
            <h3>Email</h3>
            <input type="email" placeholder="biglayo@gmail.com">
            <h3>Password</h3>
            <input type="password" placeholder="At least 6 characters"><br><br>
        </form>
        <button>Sign In</button><br><br>
        <p class="texts">Already Have An Account? <span style="color: green; cursor: pointer;">log in</span></p>
    </div>
    
</body>
</html>
