<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color:  blue;
            border-radius: 10px;
            height: 100px;
            width: 100px;
            margin: 80px;
        }
         .translate{
            transform: translate(400px, 200px);
        }
        .clociwise{
            transform: rotate(-45deg);
        }
        .anti-clociwise{
             transform: rotate(-45deg);
        }
    </style>
</head>
<body>
    <div class="box translate"></div>
    <div class="box clociwise"></div>
    <div class="box anti-clociwise"></div>
</body>
</html>
