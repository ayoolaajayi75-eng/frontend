<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            width: 300px;
           min-height: 100px;
            border-radius: 15px;
            background-color: burlywood;
            gap: 20px;
            justify-content: space-around;
            flex-wrap: wrap-reverse;

        }
         .container div{
            display: flex;
            background-color: green;
            color: white;
            width: 100px;
            height: 80px;
            border-radius: 10px;
            text-align: center;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div>Appel</div>
        <div>Banana</div>
        <div>Powpow</div>
        <div>Mango</div>
        <div>orange</div>
        <div>lemon</div>
        <div>pineapple</div>
    </div>

</body>
</html>
