<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            padding: 0;
        }
        header{
            background-color: black;
            width: 100%;
            height: 60px;
            padding: 30px;
            margin: 0;
        }
        a{
            display: inline-block;
            color: white;
            margin-right: 20px;
            text-decoration: none;
        }
        .h{
            background-color: blue;
            color: white;
            border-radius: 5px;
            padding: 5px;
            height: 30px;
        }
        .c:hover{
            background-color: red;
            color: white;
            border-radius:5px ;
            padding: 5px;
            height: 30px;
        }
    </style>
</head>
<body>
    <header>
        <a href="#home" class="h">Home</a>
        <a href="#services">Services</a>
        <a href="#porfolio">Porfolio</a>
        <a href="#contect" class="c">Contect</a>
    </header>
    
</body>
</html>
