<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            display: flex;
            flex-direction: column;
            padding-left: 30px;
            padding-right: 30px;
        }
        .box{
            display: flex;
            justify-content: space-between;
        }
        .boxx{
            padding: 30px;
        }
        a{
            color: black;
            text-decoration: none;
            font: bold;
        }
        .container{
            background-color: rgb(red green blue / alpha);
            width: 90%;
            min-height: 100px;
            display: flex;
            padding: 10px;
            border-radius: 15px;
            color: white;
        }
        .div{
            height: 70px;
            width: 2px;
            background-color: lightgray;
            margin: 20px;
            margin-left: 50px;
        }
        .card{
            display: flex;
            flex-direction: column;
        }
        button{
            width: 110px;
            height: 20px;
            border-radius: 5px;
            border-style: hidden;
            font-size: 10px;
        }
        .caT{
            background-color: rgb(65,5,5);
            height: 300px;
            width: 360px;
            display: flex;
            flex-direction: column;
            justify-content: end;
            border-radius: 25px;
            padding: 10px;
        }
        .caT p{
            margin-top: 0;
        }
        .caT h2{
            margin-bottom: 0;
        }
        .car{
            width: 70px;
            height: 2px;
            background-color: lightgray;
            margin: auto;
            margin-left: 10px;
            margin-top: 5px;
        }
        .can{
            display: flex;
        }
    </style>
</head>
<body>
    <header class="box">
        <h1>DESING</h1>
        <div class="boxx">
            <a href="#">OUR COMPANY</a>
            <a href="#">LOCATION</a>
            <a href="#">CONTACT</a>
        </div>
    </header>
    <div class="container">
        <h2>Award-wining<br>customs designs and digital branding</h2>
        <div class="div"></div>
        <div class="card">
            <p>with 10yrs in the industry,we are experienced in creating fully responsive wedsite,app design,and engaging brand experiences. Find out more about our Services</p>
            <button>LEARN MORE</button>
        </div>
        <div><br></div>
        <div class="caT">
            <h2>WEB DESIGN</h2>
            <div class="can">
                <p style="color: lightgray;">VIEW PROJECTS</p>
                <div class="car"></div>
            </div>
        </div>
    </div>
    
</body>
</html>
