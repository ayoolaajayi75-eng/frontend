<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUSH STORE | Premium Fashion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header {
            display: flex;
            flex-direction: column;
            height: 110px;
            width: 100%;
            margin-bottom: 1px solid wheat;
            position: sticky;
            z-index: 1100;
            top: 0;
            
        }
        .head-top {
            background-color: black;
            display: flex;
            color: white;
            height: 35px;
            justify-content: center;
            align-items: center;
            position: sticky;
            z-index: 1100;
            top: 0;

        }
        .head-bot {
            background-color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 75px;
            padding-left: 80px;
            padding-right: 80px;
            box-shadow: 1px 2px 3px rgba(0, 0, 0, 0.2);
        }
        .left {
            display: flex;
            gap: 4px;
        }
        .luxe {
            font-size: 2.5rem;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: orange;
            margin-top: 20px;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
        }
        .right{
            display: flex;
            gap: 20px;
        }
        nav a {
            text-decoration: none;
            color: black;
        }
        nav a:hover {
            color: blue;
        }
        .hero{
            background: linear-gradient(90deg, rgba(0, 0, 0, .78), rgba(0, 0, 0, .12)),
            url('https://images.unsplash.com/photo-1483985988355-763728e1935b?w=1800') center/cover no-repeat;
            min-height: 600px;
        }
    </style>
</head>
<body>
    <header>
        <div class="head-top">
            FREE SHIPPING ON ORDERS ABOVE ₦100,000
        </div>
        <div class="head-bot">
            <div class="left">
                <div class="luxe">LUXE</div>
                <div class="dot"></div>
            </div>
            <nav>
                <a href="#home">Home</a>
                <a href="#shop">Shop</a>
                <a href="#categories">Categories</a>
                <a href="#about">About</a>
            </nav>
            <div class="right">
                <div>⌕</div>
                <div>♙</div>
                <div>♧</div>
            </div>
        </div>
    </header>
    <div class="hero">
</header>

<section class="hero">

    <div class="hero-content">

        <div class="subtitle">
            NEW COLLECTION 2026
        </div>

        <h1>
            Style that speaks for you.
        </h1>

        <p>
            Discover timeless fashion pieces designed to
            make every moment unforgettable.
        </p>

        <a href="#" class="btn">
            SHOP COLLECTION →
        </a>

    </div>

</section>

<section class="explore">

    <div class="explore-top">
        <h3>EXPLORE OUR STORE</h3>
        <a href="#">View All →</a>
    </div>

    <div class="categories">

        <div class="category">
            <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=700" alt="Women's fashion">
            <h2>New Arrivals</h2>
        </div>

        <div class="category">
            <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=700" alt="Fashion collection">
            <h2>Collections</h2>
        </div>

        <div class="category">
            <img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=700" alt="Fashion outfits">
            <h2>Best Sellers</h2>
        </div>

    </div>

</section>

</body>
</html>
     </div>
</body>
</html>
